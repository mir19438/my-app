name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # --- CI PART (Cloud Runner-এ চলবে) ---
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Git Short Commit SHA
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            COMMIT_HASH=${{ steps.vars.outputs.SHA_SHORT }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ steps.vars.outputs.SHA_SHORT }}

  # --- CD PART (Local Self-Hosted Runner-এ চলবে) ---
  deploy:
    needs: build-and-push
    runs-on: self-hosted  # <--- আপনার লোকাল মেশিনে রান হবে
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i inventory.ini deploy_from_dockerhub.yml